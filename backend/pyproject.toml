[project]
name = "recicla-ai-backend"
version = "0.1.0"
description = "Backend para o sistema de reciclagem urbana"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "supabase",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
